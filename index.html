<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Toc Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<header class="container-fluid p-5 bg-primary text-white text-center">
    <h1>Tic toc toe</h1>
</header>
<div class="container mt-5">
    <div class="row">
        <div class="d-flex justify-content-center">
            <div class="col-sm-8 card" id="content">
                <div class="card-header">
                    <h3 id="turn"></h3>
                </div>
                <div class="card-body">
                    <div id="playersNameForm">
                        <div class="form-group">
                            <label for="firstPlayerName">First player's name</label>
                            <br>
                            <small class="form-text text-muted">Sign : X</small>
                            <input type="text" class="form-control" id="firstPlayerName" placeholder="Antoine">
                        </div>
                        <div class="form-group">
                            <label for="secondPlayerName">Second player's name</label>
                            <br>
                            <small class="form-text text-muted">Sign : O</small>
                            <input type="text" class="form-control" id="secondPlayerName" placeholder="Marc">
                        </div>
                        <button class="btn btn-primary" id="playButton" disabled>Play</button>
                    </div>
                    <div id="game-board"></div>
                </div>
                <div class="card-footer text-right" id="footer" hidden>
                    <button class="btn btn-primary" id="replay" >Replay</button>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
